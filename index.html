<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B3A6B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>مكتبي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F0F3F8;--sf:#fff;--ink:#16223B;--mu:#5E6B85;--br:#1B3A6B;--bi:#fff;--ac:#FF7A59;--ln:#D8DFEB;--rd:#C0392B}
@media (prefers-color-scheme:dark){:root{--bg:#0B1222;--sf:#141E36;--ink:#E8EDF8;--mu:#93A0BC;--br:#7FA6EA;--bi:#0B1222;--ln:#25324F;--rd:#FF8A7A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;line-height:1.7;max-width:600px;margin-inline:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 90px)}
h1{font-size:1.2rem;font-weight:800;margin:0}h2{font-size:1rem;font-weight:800;margin:0 0 8px}
.mu{color:var(--mu);font-size:.85rem}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:10px 0}
.chip{flex:none;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:99px;padding:6px 14px;font:600 .85rem Cairo,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{background:var(--br);color:var(--bi);border-color:var(--br)}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font:inherit}
label{display:block;font-weight:600;font-size:.85rem;margin:8px 0 3px}
.btn{border:0;border-radius:10px;background:var(--br);color:var(--bi);font:800 .9rem Cairo,sans-serif;padding:9px 14px;cursor:pointer}
.btn.l{background:none;border:1px solid var(--ln);color:var(--ink)}
.row{display:flex;gap:8px}.row>*{flex:1}
.emp{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--ln)}
.emp:last-child{border:0}
.al{border-inline-start:4px solid var(--ac);padding:4px 10px;margin:6px 0;background:var(--bg);border-radius:8px;font-size:.88rem}
.paper{background:#fff;color:#111;border-radius:6px;padding:22px;white-space:pre-wrap;font-size:.95rem;line-height:2;border:1px solid var(--ln)}
.ans{border:1px solid var(--ln);border-radius:12px;padding:10px;margin-top:10px;background:var(--bg)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
nav{position:fixed;inset:auto 0 0 0;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 4px)}
nav div{display:flex;max-width:600px;margin:auto}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:9px 0 5px;font:600 .72rem Cairo,sans-serif;cursor:pointer}
nav button span{display:block;font-size:1.25rem;line-height:1.2}
nav button[aria-selected=true]{color:var(--br)}
.tab{display:none}.tab.on{display:block}
#toast{position:fixed;inset:auto 16px 84px;max-width:420px;margin-inline:auto;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:12px;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
#printArea{display:none}
@media print{body>*{display:none!important}body>#printArea{display:block!important;white-space:pre-wrap;font:14pt/2 Cairo,serif;color:#000;background:#fff;padding:0}}
</style>
</head>
<body>
<h1>مكتبي</h1>
<div class="chips" id="clients"></div>

<section id="t1" class="tab on">
  <div class="box"><h2>تنبيهات</h2><div id="alerts"></div></div>
  <div class="box"><h2 id="cn"></h2><p class="mu" id="ci"></p><div id="emps"></div>
    <button class="btn" id="addE" style="margin-top:10px">+ موظف</button>
    <button class="btn l" id="delC" style="margin-top:10px">حذف العميل</button></div>
  <div class="box"><h2>نسخة احتياطية</h2>
    <button class="btn l" id="exp">تصدير</button> <button class="btn l" id="imp">استيراد</button>
    <input type="file" id="file" accept=".json" hidden></div>
</section>

<section id="t2" class="tab">
  <div class="box"><h2>مولّد المستندات</h2>
    <label for="dt">المستند</label>
    <select id="dt"><option value="contract">عقد عمل</option><option value="offer">عرض عمل</option><option value="warn">إنذار</option><option value="exp">شهادة خبرة</option><option value="clear">إخلاء طرف</option><option value="jd">وصف وظيفي</option></select>
    <label for="de">الموظف</label><select id="de"></select>
    <label for="dx">تفاصيل إضافية (سبب الإنذار، المهام…)</label><textarea id="dx" rows="3"></textarea>
    <button class="btn" id="gen" style="margin-top:10px">أنشئ</button>
  </div>
  <div id="prev" hidden><div class="paper" id="paper"></div>
    <div class="row" style="margin-top:10px"><button class="btn" id="prt">طباعة / حفظ PDF</button><button class="btn l" id="cpy">نسخ النص</button></div>
    <p class="mu" style="margin-top:8px">النماذج استرشادية، وراجعها مع محامي عمل قبل الاعتماد.</p></div>
</section>

<section id="t3" class="tab">
  <div class="box"><h2>ردود جاهزة</h2><input id="s" placeholder="ابحث: اختبار، إجازة، عقد…" aria-label="بحث"><div id="al"></div></div>
  <div class="box"><h2>رصيد الإجازة السنوية</h2>
    <div class="row"><div><label for="yr">سنوات الخدمة</label><input id="yr" type="number" min="0" value="3"></div><div><label for="ag">السن</label><input id="ag" type="number" value="30"></div></div>
    <p id="lv" style="font-weight:800"></p></div>
</section>

<nav><div role="tablist">
<button role="tab" aria-selected="true" data-t="t1"><span>🏢</span>العملاء</button>
<button role="tab" aria-selected="false" data-t="t2"><span>📄</span>مستندات</button>
<button role="tab" aria-selected="false" data-t="t3"><span>💬</span>ردود</button>
</div></nav>
<div id="toast" role="status"></div>
<div id="printArea"></div>

<script>
var $=function(s){return document.querySelector(s)};
var IND={factory:"مصنع",retail:"محلات وفروع",office:"شركة خدمات",other:"مجال آخر"};
var db={clients:[],cur:null};
try{var sv=JSON.parse(localStorage.getItem("maktabi2"));if(sv&&sv.clients)db=sv}catch(e){}
function save(){try{localStorage.setItem("maktabi2",JSON.stringify(db))}catch(e){toast("تعذر الحفظ")}}
function toast(t){var e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(function(){e.classList.remove("show")},1800)}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function C(){return db.clients.filter(function(c){return c.id===db.cur})[0]||db.clients[0]}
function dfmt(s){var d=new Date(s);return isNaN(d)?"—":d.toLocaleDateString("ar-EG",{year:"numeric",month:"long",day:"numeric"})}
function addM(s,m){var d=new Date(s);d.setMonth(d.getMonth()+m);return d}
function days(d){return Math.ceil((d-new Date())/864e5)}
function render(){
  $("#clients").innerHTML=db.clients.map(function(c){return '<button class="chip" aria-pressed="'+(c===C())+'" data-id="'+c.id+'">'+esc(c.name)+'</button>'}).join("")+'<button class="chip" id="addC">+ عميل</button>';
  var c=C();
  if(!c){$("#cn").textContent="ابدأ بإضافة أول عميل";$("#ci").textContent="";$("#emps").innerHTML="";$("#alerts").innerHTML="";$("#de").innerHTML="";return}
  $("#cn").textContent=c.name;$("#ci").textContent=IND[c.ind];
  $("#emps").innerHTML=c.emps.length?c.emps.map(function(e){return '<div class="emp"><div><b>'+esc(e.name)+'</b><br><span class="mu">'+esc(e.job)+' · من '+dfmt(e.start)+'</span></div><button class="btn l" data-del="'+e.id+'" aria-label="حذف">✕</button></div>'}).join(""):'<p class="mu">مفيش موظفين لسه. أضف أول موظف.</p>';
  var al=[];
  c.emps.forEach(function(e){
    var p=days(addM(e.start,3));if(p>=0&&p<=14)al.push(e.name+": الاختبار ينتهي بعد "+p+" يوم");
    if(e.end){var k=days(new Date(e.end));if(k<0)al.push(e.name+": العقد انتهى");else if(k<=30)al.push(e.name+": العقد ينتهي بعد "+k+" يوم")}});
  $("#alerts").innerHTML=al.length?al.map(function(a){return '<div class="al">'+esc(a)+'</div>'}).join(""):'<p class="mu">مفيش تنبيهات دلوقتي.</p>';
  $("#de").innerHTML=c.emps.map(function(e){return '<option value="'+e.id+'">'+esc(e.name)+'</option>'}).join("");
  ans()}
$("#clients").onclick=function(e){var b=e.target.closest("button");if(!b)return;
  if(b.id==="addC"){var n=prompt("اسم الشركة؟");if(!n)return;var k=prompt("المجال: factory (مصنع) / retail (محلات) / office (خدمات) / other","office");if(!IND[k])k="other";
    var id=Date.now();db.clients.push({id:id,name:n,ind:k,emps:[]});db.cur=id}
  else db.cur=+b.dataset.id;save();render()};
$("#addE").onclick=function(){var c=C();if(!c)return toast("أضف عميل أولًا");
  var n=prompt("اسم الموظف؟");if(!n)return;var j=prompt("المسمى الوظيفي؟","")||"";
  var s=prompt("تاريخ التعيين (YYYY-MM-DD)",new Date().toISOString().slice(0,10));if(isNaN(new Date(s)))return toast("تاريخ غير صحيح");
  var sal=prompt("الأجر الشهري (جنيه)","")||"";var en=prompt("تاريخ انتهاء العقد إن وجد (YYYY-MM-DD)","")||"";
  c.emps.push({id:Date.now(),name:n,job:j,start:s,salary:sal,end:en});save();render()};
$("#emps").onclick=function(e){var b=e.target.closest("[data-del]");if(!b||!confirm("حذف الموظف؟"))return;var c=C();c.emps=c.emps.filter(function(x){return x.id!==+b.dataset.del});save();render()};
$("#delC").onclick=function(){var c=C();if(!c||!confirm("حذف "+c.name+" وكل موظفيه؟"))return;db.clients=db.clients.filter(function(x){return x!==c});db.cur=null;save();render()};
$("#exp").onclick=function(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:"application/json"}));a.download="maktabi-backup.json";a.click()};
$("#imp").onclick=function(){$("#file").click()};
$("#file").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d.clients)throw 0;db=d;save();render();toast("تم الاستيراد ✓")}catch(x){toast("ملف غير صالح")}};r.readAsText(f)};
var T={
contract:function(c,e,x){return "عقد عمل\n\nإنه في يوم "+dfmt(new Date())+" تم الاتفاق بين:\nأولًا: "+c.name+" (صاحب العمل).\nثانيًا: "+e.name+" (العامل).\n\n1) يعمل الطرف الثاني بوظيفة: "+e.job+".\n2) يبدأ العمل في: "+dfmt(e.start)+(e.end?"، وينتهي العقد في "+dfmt(e.end):"، والعقد غير محدد المدة")+".\n3) الأجر الشهري: "+(e.salary||"……")+" جنيهًا مصريًا، يصرف نهاية كل شهر.\n4) فترة الاختبار 3 أشهر كحد أقصى من تاريخ البدء.\n5) يلتزم صاحب العمل بالتأمين على العامل وفق القانون.\n6) ما لم يرد به نص يخضع العقد لقانون العمل رقم 14 لسنة 2025.\n"+(x?"7) "+x+"\n":"")+"\nحُرر من 4 نسخ بالعربية، لكل طرف نسخة.\n\nصاحب العمل: ........   العامل: ........"},
offer:function(c,e,x){return "السيد/ "+e.name+"\nتحية طيبة،\n\nيسعد "+c.name+" أن تعرض عليك الانضمام لفريقها بوظيفة "+e.job+"، بأجر شهري "+(e.salary||"……")+" جنيهًا، اعتبارًا من "+dfmt(e.start)+".\n"+(x?x+"\n":"")+"\nنرجو تأكيد قبولك كتابيًا.\n\nمع التقدير،\nإدارة الموارد البشرية - "+c.name},
warn:function(c,e,x){return "إنذار\n\nالسيد/ "+e.name+" - "+e.job+"\nالتاريخ: "+dfmt(new Date())+"\n\nنلفت نظركم إلى المخالفة التالية:\n"+(x||"……")+"\n\nونرجو عدم تكرارها، وإلا سنضطر لاتخاذ الإجراءات المقررة وفق لائحة الشركة والقانون.\n\nالموارد البشرية - "+c.name+"\nاستلمت: ........"},
exp:function(c,e,x){return "شهادة خبرة\n\nتشهد "+c.name+" بأن السيد/ "+e.name+" عمل لديها بوظيفة "+e.job+" اعتبارًا من "+dfmt(e.start)+(e.end?" حتى "+dfmt(e.end):" وحتى تاريخه")+".\n"+(x?x+"\n":"")+"\nوقد أُعطيت له هذه الشهادة بناءً على طلبه.\n\nالتاريخ: "+dfmt(new Date())+"\nالموارد البشرية - "+c.name},
clear:function(c,e,x){return "إخلاء طرف\n\nأقر أنا/ "+e.name+" - "+e.job+" بأنني سلّمت جميع العهد والمستندات الخاصة بـ"+c.name+"، وأنه لا مطالبات متبادلة بيننا إلا ما يُذكر:\n"+(x||"لا يوجد")+"\n\nالتاريخ: "+dfmt(new Date())+"\nالموظف: ........   الشركة: ........"},
jd:function(c,e,x){return "وصف وظيفي\n\nالشركة: "+c.name+"\nالمسمى: "+e.job+"\nالمجال: "+IND[c.ind]+"\n\nالمهام الرئيسية:\n"+(x||"• ……\n• ……")+"\n\nالمؤهلات: ……\nالخبرة: ……"}};
$("#gen").onclick=function(){var c=C(),e=c&&c.emps.filter(function(z){return z.id===+$("#de").value})[0];if(!e)return toast("اختر موظف أولًا");
  $("#paper").textContent=T[$("#dt").value](c,e,$("#dx").value.trim());$("#prev").hidden=false};
$("#prt").onclick=function(){$("#printArea").textContent=$("#paper").textContent;window.print()};
$("#cpy").onclick=function(){try{navigator.clipboard.writeText($("#paper").textContent).then(function(){toast("تم النسخ ✓")})}catch(e){toast("انسخ يدويًا")}};
var ANS=[["فترة الاختبار","3 أشهر كحد أقصى، ولا يجوز تعيين نفس العامل تحت الاختبار أكثر من مرة لدى نفس صاحب العمل (قانون 14 لسنة 2025)."],["الإجازة السنوية","15 يوم في السنة الأولى، 21 يوم من الثانية، 30 يوم بعد 10 سنوات خدمة أو سن 50."],["عقد العمل","مكتوب بالعربية في 4 نسخ، والعامل يحصل على نسخة. الأصل غير محدد المدة."],["الأعياد الرسمية","إجازة بأجر بقرار من وزير العمل (المادة 129). الاشتغال فيها بأجر مضاعف أو يوم راحة بديل بطلب كتابي."],["ساعات العمل","لا يزيد إجمالي ساعات اليوم عن 10 ساعات شاملة الإضافي. نسبة الأجر الإضافي راجعها من المادة 121."],["التأمينات","حصة الموظف 11% والشركة 18.75% من الأجر التأميني (قانون 148 لسنة 2019). الحدود بتتغير سنويًا."]];
function ans(){var q=$("#s").value.trim();$("#al").innerHTML=ANS.filter(function(a){return!q||(a[0]+a[1]).indexOf(q)>-1}).map(function(a,i){return '<div class="ans"><b>'+a[0]+'</b><br>'+a[1]+'<br><button class="btn l" data-c="'+ANS.indexOf(a)+'" style="margin-top:6px;padding:4px 10px">نسخ</button></div>'}).join("")||'<p class="mu">مفيش نتيجة.</p>'}
$("#s").oninput=ans;
$("#al").onclick=function(e){var b=e.target.closest("[data-c]");if(!b)return;try{navigator.clipboard.writeText(ANS[+b.dataset.c][1]).then(function(){toast("تم النسخ ✓")})}catch(x){toast("انسخ يدويًا")}};
function lv(){var y=+$("#yr").value||0,a=+$("#ag").value||0;$("#lv").textContent="الرصيد: "+((y>=10||a>50)?30:(y<1?15:21))+" يوم"}
$("#yr").oninput=lv;$("#ag").oninput=lv;lv();
document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){document.querySelectorAll("nav button").forEach(function(x){x.setAttribute("aria-selected",x===b)});document.querySelectorAll(".tab").forEach(function(t){t.classList.toggle("on",t.id===b.dataset.t)});scrollTo(0,0)}});
render();
if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
</script>
</body>
</html>
