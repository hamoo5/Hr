<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة الموظفين</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mut:#6b7785;--pr:#0f766e;--bd:#dde3ea}
@media(prefers-color-scheme:dark){:root{--bg:#0f1419;--card:#1a2129;--tx:#e8edf2;--mut:#93a0ad;--pr:#2dd4bf;--bd:#2b3540}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--tx);padding:12px;max-width:560px;margin:auto}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:17px}h3{margin:0 0 8px;font-size:15px}
input,select{width:100%;padding:11px;margin:4px 0;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px}
button{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:11px 14px;font-size:15px;margin-top:6px;width:100%}
button.s{background:var(--bd);color:var(--tx);width:auto;padding:6px 10px;margin:0 4px 0 0}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);gap:8px}
.otp{font-size:38px;letter-spacing:8px;text-align:center;font-weight:700;color:var(--pr);direction:ltr}
.mut{color:var(--mut);font-size:13px}
#t{position:fixed;bottom:16px;left:12px;right:12px;padding:12px;border-radius:10px;color:#fff;display:none;z-index:9;text-align:center}
#t.ok{background:#15803d}#t.bad{background:#b91c1c}
</style>
</head>
<body>
<div id="app"></div>
<div id="t"></div>
<script>
const U='https://fpbyjzaebowcwzggzmku.supabase.co';
const K='sb_publishable_0TZ-zyOeYBtp0qbt0uPPbA_VHHE_-jc';
const sb=supabase.createClient(U,K);
const $=id=>document.getElementById(id);
const v=id=>$(id).value.trim();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=(t,ok=1)=>{const e=$('t');e.textContent=t;e.className=ok?'ok':'bad';e.style.display='block';setTimeout(()=>e.style.display='none',4500)};
async function rpc(n,a){const r=await sb.rpc(n,a);if(r.error){toast(r.error.message,0);return null}return{d:r.data}}
const out=async()=>{await sb.auth.signOut();location.reload()};
let M=null;

async function init(){
  const{data:{session}}=await sb.auth.getSession();
  session?home():loginView();
}

function loginView(){
  $('app').innerHTML=`<div class="c"><h2>تسجيل الدخول</h2>
  <input id="em" type="text" autocapitalize="none" placeholder="الإيميل (أو كود الموظف)" autocomplete="username">
  <input id="pw" type="password" placeholder="الباسورد" autocomplete="current-password">
  <button onclick="login()">دخول</button></div>`;
}
async function login(){
  let em=v('em').toLowerCase();if(!em.includes('@'))em+='@emp.local';
  const{error}=await sb.auth.signInWithPassword({email:em,password:$('pw').value});
  if(error)return toast('بيانات الدخول غير صحيحة',0);
  home();
}

async function home(){
  const{data,error}=await sb.from('memberships').select('company_id,role,companies(name)');
  if(error)return toast(error.message,0);
  if(!data.length)return createView();
  M=data[0];
  ['owner','admin'].includes(M.role)?adminView():empView();
}

function createView(){
  $('app').innerHTML=`<div class="c"><h2>إنشاء شركة جديدة</h2>
  <input id="n" placeholder="اسم الشركة/المحل"><input id="a" placeholder="النشاط (سوبر ماركت، مصنع...)">
  <input id="p" placeholder="التليفون"><button onclick="mkCompany()">إنشاء</button>
  <button class="s" onclick="out()" style="margin-top:10px">خروج</button></div>`;
}
async function mkCompany(){
  const r=await rpc('create_company',{p_name:v('n'),p_activity_type:v('a'),p_phone:v('p')});
  if(r)home();
}

/* ============ المالك / المدير ============ */
function adminView(){
  $('app').innerHTML=`
  <div class="c"><div class="row" style="border:0"><h2 style="margin:0">${esc(M.companies?.name)}</h2>
  <button class="s" onclick="out()">خروج</button></div><span class="mut">الدور: ${esc(M.role)}</span></div>

  <div class="c"><h3>الورديات المفتوحة (كود الحضور)</h3><div id="shl" class="mut"></div>
  <div id="otp" class="otp"></div><div id="osm" class="mut" style="text-align:center"></div>
  <h3 style="margin-top:14px">فتح وردية جديدة</h3>
  <input id="sn" placeholder="اسم الوردية (صباحية)"><input id="sm" type="number" value="60" placeholder="المدة بالدقايق">
  <button onclick="openShift()">فتح وردية جديدة</button></div>

  <div class="c"><h3>الموظفين</h3><div id="emps"></div></div>

  <div class="c"><h3>إضافة موظف</h3>
  <input id="ec" placeholder="كود الموظف (EMP01)"><input id="en" placeholder="الاسم بالكامل">
  <input id="es" type="number" placeholder="المرتب الأساسي">
  <select id="er"><option value="employee">موظف</option><option value="cashier">كاشير</option><option value="supervisor">مشرف</option></select>
  <button onclick="addEmp()">إضافة</button></div>

  <div class="c"><h3>السلف المعلقة</h3><div id="adv"></div></div>

  <div class="c"><h3>الرواتب</h3>
  <input id="pm" type="month"><input id="pd" type="number" value="26" placeholder="أيام العمل في الشهر">
  <button onclick="genPay()">توليد المسير (مسودة)</button><button onclick="apvPay()">اعتماد المسير</button>
  <div id="pay"></div></div>`;
  $('pm').value=new Date().toISOString().slice(0,7);
  loadShifts();loadEmps();loadAdv();loadPay();
}
let NOPEN=0;
async function loadShifts(){
  const{data,error}=await sb.from('shifts').select('id,shift_name,expires_at').eq('company_id',M.company_id).gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false});
  if(error)return toast(error.message,0);
  NOPEN=data.length;
  $('shl').innerHTML=data.length?data.map(s=>`<div class="row"><div>${esc(s.shift_name)}<div class="mut">ينتهي ${new Date(s.expires_at).toLocaleTimeString('ar-EG')}</div></div><button class="s" onclick="showCode('${s.id}')">إظهار كود جديد</button></div>`).join(''):'لا توجد وردية مفتوحة';
}
async function showCode(id){
  const r=await rpc('rotate_shift_otp',{p_shift_id:id,p_extend_minutes:0});
  if(r){$('otp').textContent=r.d;$('osm').textContent='كود جديد (القديم اتلغى)'}
}
async function openShift(){
  if(NOPEN&&!confirm('فيه وردية مفتوحة بالفعل. تفتح وردية جديدة؟'))return;
  const r=await rpc('open_shift',{p_company_id:M.company_id,p_shift_name:v('sn')||'وردية',p_minutes:+v('sm')||60});
  if(!r)return;const s=r.d[0];
  $('otp').textContent=s.otp;
  $('osm').textContent='ينتهي: '+new Date(s.expires_at).toLocaleTimeString('ar-EG');
  loadShifts();
}
async function loadEmps(){
  const{data,error}=await sb.from('employees').select('id,employee_code,full_name,user_id').eq('company_id',M.company_id).order('created_at');
  if(error)return toast(error.message,0);
  $('emps').innerHTML=data.length?data.map(e=>`<div class="row" style="flex-wrap:wrap"><div><b>${esc(e.full_name)}</b> <span class="mut">(${esc(e.employee_code)})</span></div>${e.user_id?`<span class="mut">اسم الدخول: <b dir="ltr">${esc((e.employee_code+'-'+M.company_id.slice(0,6)).toLowerCase())}</b></span>`:`<div style="width:100%"><input id="u${e.id}" placeholder="اكتب باسورد للموظف (6 حروف أو أكتر)"><button class="s" style="margin:4px 0" onclick="mkLogin('${e.id}')">إنشاء حساب دخول</button></div>`}</div>`).join(''):'<span class="mut">لا يوجد موظفين بعد</span>';
}
async function mkLogin(id){
  const pw=$('u'+id).value;
  if(pw.length<6)return toast('الباسورد 6 حروف على الأقل',0);
  const{data,error}=await sb.functions.invoke('create-employee-login',{body:{employee_id:id,password:pw}});
  if(error||data?.error)return toast(data?.error||error.message,0);
  alert('تم! اسم الدخول للموظف:\n'+data.username+'\nوالباسورد اللي كتبته.');
  loadEmps();
}
async function addEmp(){
  const a={p_company_id:M.company_id,p_employee_code:v('ec'),p_full_name:v('en'),p_base_salary:+v('es')||0,p_role:v('er')};
  const r=await rpc('add_employee',a);
  if(r){toast('تمت إضافة الموظف، اعمل له حساب دخول من كارت الموظفين');['ec','en','es'].forEach(i=>$(i).value='');loadEmps()}
}
async function loadAdv(){
  const{data,error}=await sb.from('advances').select('id,amount,reason,employees(full_name)').eq('company_id',M.company_id).eq('status','pending').order('requested_at');
  if(error)return toast(error.message,0);
  $('adv').innerHTML=data.length?data.map(a=>`<div class="row"><div><b>${esc(a.employees?.full_name)}</b> - ${a.amount} ج<div class="mut">${esc(a.reason)}</div></div>
  <div><button class="s" onclick="decide('${a.id}',true)">قبول</button><button class="s" onclick="decide('${a.id}',false)">رفض</button></div></div>`).join(''):'<span class="mut">لا يوجد</span>';
}
async function decide(id,ok){if(await rpc('decide_advance',{p_advance_id:id,p_approve:ok}))loadAdv()}
async function genPay(){
  const r=await rpc('generate_payroll',{p_company_id:M.company_id,p_month:v('pm')+'-01',p_working_days:+v('pd')||26});
  if(r){toast('تم توليد '+r.d+' مسير');loadPay()}
}
async function apvPay(){
  const r=await rpc('approve_payroll',{p_company_id:M.company_id,p_month:v('pm')+'-01'});
  if(r){toast('تم اعتماد '+r.d+' مسير');loadPay()}
}
async function loadPay(){
  const{data,error}=await sb.from('payrolls').select('base_salary,deductions,advances_deducted,bonuses,net_salary,status,month_year,employees(full_name)').eq('company_id',M.company_id).order('month_year',{ascending:false}).limit(30);
  if(error)return;
  $('pay').innerHTML=data.map(p=>`<div class="row"><div>${esc(p.employees?.full_name)}<div class="mut">${p.month_year.slice(0,7)} | ${p.status}</div></div><b>${p.net_salary}</b></div>`).join('');
}

/* ============ الموظف ============ */
let SH=null;
async function empView(){
  $('app').innerHTML=`
  <div class="c"><div class="row" style="border:0"><h2 style="margin:0">${esc(M.companies?.name)}</h2>
  <button class="s" onclick="out()">خروج</button></div></div>

  <div class="c"><h3>تسجيل الحضور</h3><div id="sh" class="mut"></div>
  <input id="ot" inputmode="numeric" maxlength="6" placeholder="كود الوردية (6 أرقام)">
  <button onclick="checkIn()">تسجيل حضور</button><button class="s" style="width:100%;margin:6px 0 0" onclick="checkOut()">تسجيل انصراف</button></div>

  <div class="c"><h3>طلب سلفة</h3><input id="am" type="number" placeholder="المبلغ"><input id="rs" placeholder="السبب">
  <button onclick="reqAdv()">إرسال الطلب</button><div id="my"></div></div>

  <div class="c"><h3>مسير راتبي</h3><div id="pay"></div></div>`;
  const{data}=await sb.from('shifts').select('id,shift_name,expires_at').gt('expires_at',new Date().toISOString()).order('created_at',{ascending:false}).limit(1);
  SH=data?.[0]||null;
  $('sh').textContent=SH?'الوردية المفتوحة: '+SH.shift_name:'لا توجد وردية مفتوحة حالياً';
  loadMy();loadPay2();
}
async function checkIn(){
  if(!SH)return toast('لا توجد وردية مفتوحة',0);
  const r=await rpc('check_in',{p_shift_id:SH.id,p_otp:v('ot')});
  if(!r)return;
  toast(r.d.message,r.d.ok);
  if(r.d.ok){$('ot').value='';toast('تم الحضور. هيتقفل حسابك تلقائياً بعد 60 ثانية');setTimeout(out,60000)}
}
async function checkOut(){
  if(!SH)return toast('لا توجد وردية',0);
  const r=await rpc('check_out',{p_shift_id:SH.id});
  if(r)toast(r.d.message,r.d.ok);
}
async function reqAdv(){
  const r=await rpc('request_advance',{p_company_id:M.company_id,p_amount:+v('am'),p_reason:v('rs')});
  if(r){toast('تم إرسال الطلب');$('am').value=$('rs').value='';loadMy()}
}
async function loadMy(){
  const{data}=await sb.from('advances').select('amount,status,requested_at').order('requested_at',{ascending:false}).limit(5);
  const t={pending:'قيد المراجعة',approved:'موافق',rejected:'مرفوض',settled:'تم الخصم'};
  $('my').innerHTML=(data||[]).map(a=>`<div class="row"><span>${a.amount} ج</span><span class="mut">${t[a.status]}</span></div>`).join('');
}
async function loadPay2(){
  const{data}=await sb.from('payrolls').select('month_year,net_salary,status').order('month_year',{ascending:false}).limit(6);
  $('pay').innerHTML=(data||[]).length?data.map(p=>`<div class="row"><span>${p.month_year.slice(0,7)}</span><b>${p.net_salary} ج</b></div>`).join(''):'<span class="mut">لا يوجد مسير معتمد بعد</span>';
}
init();
</script>
</body>
</html>
